<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eye Analytics Playground</title>
  </head>
  <body>
    <div id="app">
      <h1>Eye Analytics Playground</h1>
      
      <div class="actions">
        <button id="trackEvent">Track Custom Event</button>
        <button id="trackPageView">Track Page View</button>
      </div>

      <div class="log">
        <h2>Event Log</h2>
        <pre id="eventLog"></pre>
      </div>
    </div>
    <script type="module" src="/main.ts"></script>

    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
      }
      
      .actions {
        margin: 2rem 0;
        display: flex;
        gap: 1rem;
      }
      
      button {
        padding: 0.5rem 1rem;
        font-size: 1rem;
      }
      
      .log {
        background: #f5f5f5;
        padding: 1rem;
        border-radius: 4px;
      }
      
      #eventLog {
        margin: 0;
        white-space: pre-wrap;
      }
    </style>
  </body>
</html>
